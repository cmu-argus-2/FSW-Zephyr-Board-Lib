# Shared by FSW-Mainboard-C and the F' flight software. Put a setting here only
# if both teams need it; app-specific settings (stack sizes, logging, C++ and
# F' options) stay in each app's prj.conf, which is applied before this file.
#
# Hardware facts (clock speeds, regulators, console) belong in
# boards/cmu/argus/Kconfig.defconfig instead, so they apply with no opt-in.

# Every sensor, the RTC and the fuel gauge are on I2C0/I2C1.
CONFIG_I2C=y

# Fault on stack overflow instead of silently corrupting memory.
CONFIG_HW_STACK_PROTECTION=y
