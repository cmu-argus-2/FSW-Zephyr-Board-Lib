# West manifest: pins the Zephyr version and the modules the Argus board needs.
#
# Both flight software repos (FSW-Mainboard-C and the F' one) import this file,
# so they always build against the same Zephyr. Change the Zephyr revision here,
# never in an app's own west.yml.

manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: 839728050444f90d06870b5fc9bbbda106d91459
      import:
        name-allowlist:
          - cmsis_6       # Cortex-M33 core support
          - hal_rpi_pico  # RP2350 drivers
          - fatfs         # SD card filesystem
          - littlefs      # on-board flash storage
          - loramac-node  # SX1262 radio backend

  self:
    path: FSW-Zephyr-Board-Lib
